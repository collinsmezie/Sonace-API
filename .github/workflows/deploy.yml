name: Deploy Sonace API to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
        shell: bash
      
      - name: Debug SSH key setup
        run: |
          ls -la ~/.ssh
          cat ~/.ssh/known_hosts
        shell: bash

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd ~
          chmod +x deploy_sonace.sh  # Ensure script is executable
          ./deploy_sonace.sh
          EOF
        shell: bash
